# Self-hosted Convex stack for Click Hunter.
#
# Quick start (see docs/self-hosting.md for the full runbook):
#   1. cp docker/.env.selfhosted.example docker/.env.selfhosted
#   2. docker compose up -d
#   3. docker compose exec backend ./generate_admin_key.sh  # paste key into docker/.env.selfhosted
#   4. pnpm backend:push     # push Convex functions to the self-hosted backend
#   5. pnpm dev:selfhosted   # local dev against the self-hosted backend
#
# Ports: backend http://127.0.0.1:3210 · site actions http://127.0.0.1:3211
#        dashboard http://localhost:6791 · web http://localhost:8080
name: click-hunter

services:
  backend:
    # Pin with CONVEX_BACKEND_VERSION=x.y.z to match your `convex` npm package.
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_VERSION:-latest}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_PORT:-3210}:3210"
      - "${CONVEX_SITE_PORT:-3211}:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      CONVEX_CLOUD_ORIGIN: http://127.0.0.1:${CONVEX_PORT:-3210}
      CONVEX_SITE_ORIGIN: http://127.0.0.1:${CONVEX_SITE_PORT:-3211}
      INSTANCE_NAME: ${INSTANCE_NAME:-click-hunter}
      APPLICATION_MAX_CONCURRENT_MUTATIONS: ${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      APPLICATION_MAX_CONCURRENT_NODE_ACTIONS: ${APPLICATION_MAX_CONCURRENT_NODE_ACTIONS:-16}
      APPLICATION_MAX_CONCURRENT_QUERIES: ${APPLICATION_MAX_CONCURRENT_QUERIES:-16}
      APPLICATION_MAX_CONCURRENT_V8_ACTIONS: ${APPLICATION_MAX_CONCURRENT_V8_ACTIONS:-16}
      DISABLE_METRICS_ENDPOINT: ${DISABLE_METRICS_ENDPOINT:-true}
      DOCUMENT_RETENTION_DELAY: ${DOCUMENT_RETENTION_DELAY:-172800}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_BACKEND_VERSION:-latest}
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      # Must be browser-reachable. Override with PUBLIC_CONVEX_URL when the
      # backend lives on a remote host.
      NEXT_PUBLIC_DEPLOYMENT_URL: ${PUBLIC_CONVEX_URL:-http://127.0.0.1:${CONVEX_PORT:-3210}}
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CONVEX_URL: ${PUBLIC_CONVEX_URL:-http://127.0.0.1:3210}
        VITE_CONVEX_SITE_URL: ${PUBLIC_CONVEX_SITE_URL:-http://127.0.0.1:3211}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex-data:

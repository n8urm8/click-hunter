# Security headers for the web app. Included in every location in nginx.conf:
# nginx drops server-level add_header lines inside any location that sets its
# own add_header (the asset cache rule does), so each location includes this.
#
# The app loads only its own scripts, styles, fonts and images (no CDNs, no
# inline scripts). The Convex backend lives on a deployment-specific origin
# (PUBLIC_CONVEX_URL at build time), so connect-src allows any https/wss host;
# the 127.0.0.1 entries are for the local self-hosted stack.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: http://127.0.0.1:* ws://127.0.0.1:*; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Browsers only honor HSTS over HTTPS, so this is inert on plain-HTTP local runs.
add_header Strict-Transport-Security "max-age=31536000" always;
